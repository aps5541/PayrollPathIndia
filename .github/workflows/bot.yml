name: bot
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
concurrency:
  group: bot
  cancel-in-progress: false
permissions:
  actions: write
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: |
          timeout 345m python Main.py || code=$?
          if [ "${code:-0}" -eq 124 ]; then
            gh workflow run bot.yml --ref ${{ github.ref_name }}
            exit 0
          fi
          exit ${code:-0}
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GH_TOKEN: ${{ github.token }}
